services:
  tk:
    image: ${DOCKERHUB_NAMESPACE:-etng}/tk:${TOOLKIT_IMAGE_TAG:-latest}
    container_name: personal-toolkit
    ports:
      - "${TOOLKIT_HTTP_ADDR:-127.0.0.1}:${TOOLKIT_HTTP_PORT:-8088}:80"
    restart: unless-stopped

  docker-service-bridge:
    image: ${DOCKERHUB_NAMESPACE:-etng}/tk-docker-service-bridge:${TOOLKIT_IMAGE_TAG:-latest}
    container_name: tooldkit-docker-service-bridge
    command:
      - -addr
      - 0.0.0.0:17321
      - -origins
      - ${TOOLKIT_ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088,https://etng.github.io}
    ports:
      - "127.0.0.1:17321:17321"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

